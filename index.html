<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safidy Decision Engine - Ingestion Concertations & Ateliers</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f0f4f8; color: #102a43; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        nav { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #cbd5e1; padding-bottom: 12px; }
        nav a { text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
        nav a.active { background-color: #0b69a3; color: white; }
        nav a.inactive { background-color: #e2e8f0; color: #475569; }
        
        h1 { color: #0b69a3; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 25px; font-size: 0.95rem; }

        .form-group { margin-bottom: 18px; }
        .date-row { display: flex; gap: 15px; }
        .date-row .form-group { flex: 1; }

        label { display: block; font-weight: bold; margin-bottom: 6px; color: #1e293b; font-size: 0.9rem; }
        input[type="text"], input[type="date"], textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        textarea { resize: vertical; min-height: 90px; }
        
        .file-upload-box { border: 2px dashed #0b69a3; background-color: #f0f9ff; padding: 20px; text-align: center; border-radius: 8px; margin-top: 10px; }
        .file-upload-box input[type="file"] { margin-top: 10px; }

        button.btn-submit { background-color: #0b69a3; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 15px; }
        button.btn-submit:hover { background-color: #084c77; }

        .status-msg { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; }
        .status-success { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .status-error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <a href="index.html" class="active">🏛️ Ingestion Ateliers</a>
        <a href="audit.html" class="inactive">📢 Audit Citoyen</a>
        <a href="dashboard.html" class="inactive">📊 Moteur Décisionnel</a>
    </nav>

    <h1>🏛️ Safidy Decision Engine</h1>
    <p class="subtitle">Collecte & Ingestion des Résolutions d'Ateliers, Colloques et Concertations</p>

    <form id="concertationForm">
        <div class="form-group">
            <label for="titre_concertation">Titre de l'Atelier / Colloque / Concertation *</label>
            <input type="text" id="titre_concertation" required placeholder="Ex: Atelier Régional sur la Transparence Budgétaire">
        </div>

        <div class="form-group">
            <label for="organisation_source">Entité / Organisation Organisatrice *</label>
            <input type="text" id="organisation_source" required placeholder="Ex: Association Safidy, Coalition Civique...">
        </div>

        <!-- Dates de début et de fin pour les événements multi-jours -->
        <div class="date-row">
            <div class="form-group">
                <label for="date_debut">Date de début *</label>
                <input type="date" id="date_debut" required>
            </div>
            <div class="form-group">
                <label for="date_fin">Date de fin (Optionnel)</label>
                <input type="date" id="date_fin">
            </div>
        </div>

        <div class="form-group">
            <label for="parties_prenantes">Parties Prenantes Représentées</label>
            <input type="text" id="parties_prenantes" placeholder="Ex: Parti TIM, Société Civile, Groupements de Jeunes, Syndicats...">
        </div>

        <div class="form-group">
            <label for="resume_global">Résumé des Résolutions / Idées Clés (Optionnel)</label>
            <textarea id="resume_global" placeholder="Synthétisez brièvement les propositions phares issues des échanges..."></textarea>
        </div>

        <!-- Zone d'Upload Direct de Documents -->
        <div class="form-group">
            <label>📄 Documents / Pièces Jointes à Soumettre (PDF, Word, Excel, Scans)</label>
            <div class="file-upload-box">
                <p style="margin:0; color:#475569; font-size:0.9rem;">Sélectionnez vos fichiers directement depuis votre appareil :</p>
                <input type="file" id="document_file" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">📥 Enregistrer dans Safidy Decision Engine</button>
    </form>

    <div id="statusMessage" class="status-msg"></div>
</div>

<script>
    // Configuration Supabase
    const SUPABASE_URL = 'https://tunanbanizxowofzkjql.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OyEsfDZaWZwhe0pkPkqtWQ_TPtbQ5iR';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('concertationForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');
        
        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ Enregistrement et transfert du fichier en cours...";
        statusMsg.style.display = "none";

        try {
            const titre = document.getElementById('titre_concertation').value;
            const organisation = document.getElementById('organisation_source').value;
            const dateDebut = document.getElementById('date_debut').value;
            const dateFin = document.getElementById('date_fin').value || dateDebut;
            const parties = document.getElementById('parties_prenantes').value;
            const resume = document.getElementById('resume_global').value;
            const fileInput = document.getElementById('document_file');

            let fileUrl = null;

            // 1. Upload du fichier dans Supabase Storage si un fichier est choisi
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `concertations/${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

                const { data: storageData, error: storageError } = await _supabase.storage
                    .from('documents_preuves')
                    .upload(fileName, file);

                if (!storageError) {
                    const { data: publicUrlData } = _supabase.storage
                        .from('documents_preuves')
                        .getPublicUrl(fileName);
                    fileUrl = publicUrlData.publicUrl;
                }
            }

            // 2. Enregistrement dans la BDD Supabase
            const { data, error } = await _supabase
                .from('rapports_concertation')
                .insert([{
                    titre_concertation: titre,
                    organisation_source: organisation,
                    date_evenement: dateDebut,
                    date_fin: dateFin,
                    parties_prenantes: parties,
                    resume_global: resume,
                    piece_jointe_url: fileUrl
                }]);

            if (error) throw error;

            statusMsg.className = "status-msg status-success";
            statusMsg.innerText = "✅ Résolution d'Atelier enregistrée avec succès dans Safidy Decision Engine !";
            statusMsg.style.display = "block";
            document.getElementById('concertationForm').reset();

        } catch (err) {
            console.error("Erreur d'enregistrement :", err);
            statusMsg.className = "status-msg status-error";
            statusMsg.innerText = "❌ Erreur lors de l'enregistrement : " + (err.message || "Veuillez vérifier votre connexion.");
            statusMsg.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "📥 Enregistrer dans Safidy Decision Engine";
        }
    });
</script>

</body>
</html>
